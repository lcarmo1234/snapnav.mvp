<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Visual public transport navigation with Street View preview for every step">
  <title>SnapNav – Visual Transit Navigation</title>
  <link rel="stylesheet" href="style.css?v=22" />
</head>
<body class="theme-dark">
  <canvas id="bg-orbs" aria-hidden="true"></canvas>

  <header>
    <h1 class="logo">SnapNav</h1>
    <span class="badge">Ultra Mode</span>
    <div class="spacer"></div>
    <button class="chip" id="toggleTheme" title="Toggle theme" aria-label="Toggle light/dark theme">
      <span class="theme-icon">☀️</span>
    </button>
  </header>

  <main>
    <section class="card controls-card" id="controls">
      <div class="stack">
        <div class="quick-saves">
          <label class="section-label">Quick Places</label>
          <div class="quick-save-chips" id="quickSaves">
            <button class="save-chip" data-location="Trinity College Dublin">🎓 Uni</button>
            <button class="save-chip" data-location="Heuston Station, Dublin">🚉 Heuston</button>
            <button class="save-chip" data-location="Temple Bar, Dublin">🍺 Temple Bar</button>
            <button class="save-chip" data-location="Dublin Airport">✈️ Airport</button>
          </div>
        </div>

        <div>
          <label for="start">Starting Point</label>
          <div class="input-group">
            <input id="start" placeholder="e.g. O'Connell Street, Dublin" aria-describedby="startNote" />
            <button class="input-btn" id="useHere" title="Use current location" aria-label="Use my current location">📍</button>
          </div>
          <div class="hint" id="startNote"></div>
        </div>

        <div>
          <label for="dest">Destination</label>
          <input id="dest" placeholder="e.g. Heuston Station" />
        </div>

        <details class="advanced-toggle">
          <summary>Advanced Options</summary>
          <div class="advanced-content">
            <div class="row">
              <div class="grow">
                <label for="pref">Route Preference</label>
                <select id="pref">
                  <option value="default">Best route</option>
                  <option value="FEWER_TRANSFERS">Fewer transfers</option>
                  <option value="LESS_WALKING">Less walking</option>
                </select>
              </div>
              <div class="grow">
                <label for="depart">Timing</label>
                <select id="depart">
                  <option value="now">Leave now</option>
                  <option value="departAt">Depart at…</option>
                  <option value="arrive">Arrive by…</option>
                </select>
              </div>
            </div>
            <div class="grow" id="timeWrapper" style="display:none;">
              <label for="time">Select Time</label>
              <input id="time" type="datetime-local" />
            </div>
          </div>
        </details>

        <div class="row action-row">
          <button class="btn btn-primary" id="routeBtn">
            <span class="btn-icon">🚌</span>
            Get Route
          </button>
          <button class="btn btn-secondary" id="nearbyBtn" title="Find nearby stops">
            <span class="btn-icon">📍</span>
            Nearby Stops
          </button>
        </div>

        <div id="routeSummary" class="route-summary"></div>
        <div id="nearby" class="nearby-results"></div>
      </div>
    </section>

    <section class="card map-card">
      <div id="map" role="application" aria-label="Transit route map"></div>
      
      <div id="routeProgress" class="route-progress" style="display:none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text">
          <span id="currentStep">Step 1</span>
          <span id="totalSteps">of 8</span>
        </div>
      </div>

      <div class="timeline-header">
        <h3 class="section-title">Visual Navigation Guide</h3>
      </div>
      
      <div id="steps" class="timeline" role="list">
        <div class="empty-state">
          <div class="empty-icon">🗺️</div>
          <p class="empty-title">Ready to navigate?</p>
          <p class="empty-subtitle">Enter your start and destination to see detailed visual directions with Street View</p>
        </div>
      </div>

      <div id="loadingSteps" class="loading-state" style="display:none;">
        <div class="spinner"></div>
        <p>Finding your route and loading Street View...</p>
      </div>
    </section>
  </main>

  <div class="dock">
    <button class="fab" id="fabLocate" title="Use my current location" aria-label="Use current location">📍</button>
    <button class="fab" id="fabTop" title="Scroll to top" aria-label="Scroll to top">⬆️</button>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <footer>
    <div class="footer-content">
      <p>Powered by Google Maps APIs • Ultra-detailed navigation mode</p>
    </div>
  </footer>

  <script>
    const apiKey = "AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA";

    // ===== UTILITY FUNCTIONS =====
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function formatDistance(meters) {
      if (meters < 1000) return `${Math.round(meters)} m`;
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function getDetailedDirection(degrees) {
      const normalized = (degrees + 360) % 360;
      if (normalized < 22.5 || normalized >= 337.5) return { dir: "straight ahead", icon: "⬆️" };
      if (normalized < 67.5) return { dir: "slightly to the right", icon: "↗️" };
      if (normalized < 112.5) return { dir: "right", icon: "➡️" };
      if (normalized < 157.5) return { dir: "sharp right", icon: "↘️" };
      if (normalized < 202.5) return { dir: "behind you", icon: "⬇️" };
      if (normalized < 247.5) return { dir: "sharp left", icon: "↙️" };
      if (normalized < 292.5) return { dir: "left", icon: "⬅️" };
      return { dir: "slightly to the left", icon: "↖️" };
    }

    function generateSimpleInstruction(step, nextStep = null) {
      const instructions = [];
      const distance = step.distance?.value || 0;
      
      if (step.travel_mode === "WALKING") {
        const heading = step.heading || 0;
        const direction = getDetailedDirection(heading);
        
        if (distance < 50) {
          instructions.push(`Walk ${direction.dir} for about ${Math.round(distance)} meters`);
        } else if (distance < 200) {
          instructions.push(`Walk ${direction.dir} for ${formatDistance(distance)}`);
        } else {
          const midpoint = Math.floor(distance / 2);
          instructions.push(`Start walking ${direction.dir}`);
          instructions.push(`Continue for ${formatDistance(distance)} (about ${Math.ceil(distance / 80)} minutes)`);
        }
        
        if (nextStep && nextStep.transit) {
          instructions.push(`Look for the ${nextStep.transit.line?.name || 'transit'} stop`);
        }
      } else if (step.transit) {
        const t = step.transit;
        const line = t.line?.short_name || t.line?.name;
        const vehicle = t.line?.vehicle?.type || 'transit';
        
        instructions.push(`Board the ${line} ${vehicle.toLowerCase()}`);
        if (t.headsign) {
          instructions.push(`Direction: ${t.headsign}`);
        }
        instructions.push(`Stay on for ${t.num_stops || 'several'} stops (${step.duration?.text})`);
        instructions.push(`Exit at: ${t.arrival_stop?.name || 'your stop'}`);
      }
      
      return instructions;
    }

    // ===== THEME TOGGLE =====
    const toggleThemeBtn = document.getElementById('toggleTheme');
    const themeIcon = toggleThemeBtn.querySelector('.theme-icon');
    
    toggleThemeBtn?.addEventListener('click', () => {
      const b = document.body;
      b.classList.toggle('theme-dark');
      b.classList.toggle('theme-light');
      const isDark = b.classList.contains('theme-dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('snapnav-theme', isDark ? 'dark' : 'light');
      showToast(`${isDark ? 'Dark' : 'Light'} theme activated`, 'success');
    });

    (function() {
      const saved = localStorage.getItem('snapnav-theme');
      if (saved === 'light') {
        document.body.classList.remove('theme-dark');
        document.body.classList.add('theme-light');
        themeIcon.textContent = '🌙';
      }
    })();

    // ===== QUICK SAVES =====
    document.getElementById('quickSaves')?.addEventListener('click', (e) => {
      const chip = e.target.closest('.save-chip');
      if (!chip) return;
      const location = chip.dataset.location;
      const destInput = document.getElementById('dest');
      if (!destInput.value.trim()) {
        destInput.value = location;
        destInput.focus();
        showToast(`Set destination to ${chip.textContent}`, 'success');
      } else {
        document.getElementById('start').value = destInput.value;
        destInput.value = location;
        showToast(`Route updated`, 'success');
      }
    });

    // ===== ADVANCED OPTIONS =====
    const departSelect = document.getElementById('depart');
    const timeWrapper = document.getElementById('timeWrapper');
    
    departSelect?.addEventListener('change', () => {
      const needsTime = departSelect.value !== 'now';
      timeWrapper.style.display = needsTime ? 'block' : 'none';
      if (needsTime && !document.getElementById('time').value) {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('time').value = now.toISOString().slice(0, 16);
      }
    });

    // ===== BACKGROUND ANIMATION =====
    (function() {
      const canvas = document.getElementById('bg-orbs');
      const ctx = canvas.getContext('2d');
      let w, h, dpr, orbs;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        const N = 12;
        orbs = new Array(N).fill(0).map(() => ({
          x: Math.random() * w, y: Math.random() * h,
          r: (30 + Math.random() * 70) * dpr,
          hue: 200 + Math.random() * 60,
          a: 0.05 + Math.random() * 0.08,
          vx: (Math.random() * 0.4 - 0.2) * dpr,
          vy: (Math.random() * 0.4 - 0.2) * dpr,
        }));
      }

      function tick() {
        ctx.clearRect(0, 0, w, h);
        for (const o of orbs) {
          o.x += o.vx; o.y += o.vy;
          if (o.x < -o.r) o.x = w + o.r;
          if (o.x > w + o.r) o.x = -o.r;
          if (o.y < -o.r) o.y = h + o.r;
          if (o.y > h + o.r) o.y = -o.r;
          const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
          grad.addColorStop(0, `hsla(${o.hue}, 85%, 60%, ${o.a})`);
          grad.addColorStop(1, `hsla(${o.hue}, 85%, 60%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener('resize', resize);
      resize(); tick();
    })();

    // ===== MAPS =====
    let map, directionsService, directionsRenderer, placesService;

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 53.3498, lng: -6.2603 },
        zoom: 13,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }]
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map,
        suppressMarkers: false,
        polylineOptions: { strokeColor: "#69a6ff", strokeWeight: 4, strokeOpacity: 0.8 }
      });
      
      placesService = new google.maps.places.PlacesService(map);

      const startInput = document.getElementById('start');
      const destInput = document.getElementById('dest');
      new google.maps.places.Autocomplete(startInput, { fields: ["place_id", "geometry", "name", "formatted_address"] });
      new google.maps.places.Autocomplete(destInput, { fields: ["place_id", "geometry", "name", "formatted_address"] });

      document.getElementById('routeBtn').addEventListener('click', buildTransitRoute);
      document.getElementById('useHere').addEventListener('click', useCurrentLocationAsStart);
      document.getElementById('nearbyBtn').addEventListener('click', listNearbyStops);
      document.getElementById('fabLocate').addEventListener('click', useCurrentLocationAsStart);
      document.getElementById('fabTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.target.id === 'start' || e.target.id === 'dest')) {
          buildTransitRoute();
        }
      });
    }

    function streetViewUrlAt(lat, lng, heading = 0, size = "500x250", panoId = null) {
      const fov = 90, pitch = 0;
      if (panoId) {
        return `https://maps.googleapis.com/maps/api/streetview?size=${size}&pano=${panoId}&heading=${heading}&fov=${fov}&pitch=${pitch}&key=${apiKey}`;
      }
      return `https://maps.googleapis.com/maps/api/streetview?size=${size}&location=${lat},${lng}&heading=${heading}&fov=${fov}&pitch=${pitch}&key=${apiKey}`;
    }

    function bearingFromTo(aLatLng, bLatLng) {
      return google.maps.geometry.spherical.computeHeading(aLatLng, bLatLng);
    }

    function useCurrentLocationAsStart() {
      const note = document.getElementById('startNote');
      if (!navigator.geolocation) {
        showToast('Geolocation not supported', 'error');
        return;
      }
      note.textContent = 'Finding your location…';
      showToast('Getting your location...', 'info');

      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        const latlng = new google.maps.LatLng(latitude, longitude);
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({ location: latlng }, (results, status) => {
          if (status === 'OK' && results[0]) {
            document.getElementById('start').value = results[0].formatted_address;
            note.textContent = '📍 Using your current location';
            showToast('Location found!', 'success');
            map.setCenter(latlng);
            map.setZoom(15);
          } else {
            document.getElementById('start').value = `${latitude}, ${longitude}`;
            note.textContent = '📍 Using coordinates';
            showToast('Using coordinates', 'success');
          }
        });
      }, () => {
        note.textContent = '';
        showToast('Could not get location', 'error');
      });
    }

    async function findNearbyLandmarks(lat, lng) {
      return new Promise((resolve) => {
        const request = {
          location: new google.maps.LatLng(lat, lng),
          radius: 100,
          type: ['point_of_interest', 'establishment']
        };
        placesService.nearbySearch(request, (results, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK && results?.length) {
            resolve(results.slice(0, 2).map(p => p.name));
          } else {
            resolve([]);
          }
        });
      });
    }

    async function buildTransitRoute() {
      const start = document.getElementById('start').value.trim();
      const dest = document.getElementById('dest').value.trim();
      const pref = document.getElementById('pref').value;
      const when = document.getElementById('depart').value;
      const timeVal = document.getElementById('time').value;
      const stepsEl = document.getElementById('steps');
      const loadingEl = document.getElementById('loadingSteps');
      const summaryEl = document.getElementById('routeSummary');

      if (!start || !dest) {
        showToast('Please enter both start and destination', 'error');
        return;
      }

      stepsEl.innerHTML = '';
      loadingEl.style.display = 'flex';
      summaryEl.innerHTML = '';

      const req = {
        origin: start,
        destination: dest,
        travelMode: google.maps.TravelMode.TRANSIT,
        transitOptions: {}
      };

      if (pref === 'FEWER_TRANSFERS' || pref === 'LESS_WALKING') {
        req.transitOptions.routingPreference = google.maps.TransitRoutePreference[pref];
      }

      const dt = timeVal ? new Date(timeVal) : new Date();
      if (when === 'arrive') req.transitOptions.arrivalTime = dt;
      else if (when === 'departAt') req.transitOptions.departureTime = dt;
      else req.transitOptions.departureTime = new Date();

      directionsService.route(req, async (result, status) => {
        loadingEl.style.display = 'none';

        if (status !== "OK") {
          stepsEl.innerHTML = `
            <div class="error-state">
              <div class="error-icon">⚠️</div>
              <p class="error-title">Could not find route</p>
              <p class="error-subtitle">Error: ${status}</p>
            </div>`;
          showToast('Route not found', 'error');
          return;
        }

        directionsRenderer.setDirections(result);
        const leg = result.routes[0].legs[0];

        summaryEl.innerHTML = `
          <div class="summary-card">
            <div class="summary-main">
              <span class="summary-duration">${leg.duration.text}</span>
              <span class="summary-distance">${leg.distance.text}</span>
            </div>
            <div class="summary-details">
              <span>🚦 ${leg.steps.length} steps</span>
              <span>🔄 ${leg.steps.filter(s => s.transit).length} transit legs</span>
            </div>
          </div>`;

        let html = "";
        const sv = new google.maps.StreetViewService();

        const getPano = (latLng) => new Promise((resolve) => {
          sv.getPanorama({ location: latLng, radius: 30, source: google.maps.StreetViewSource.OUTDOOR },
            (data, st) => resolve(st === google.maps.StreetViewStatus.OK && data?.location?.pano ? data.location.pano : null)
          );
        });

        for (let i = 0; i < leg.steps.length; i++) {
          const step = leg.steps[i];
          const nextStep = i < leg.steps.length - 1 ? leg.steps[i + 1] : null;
          
          let lat = step.start_location.lat();
          let lng = step.start_location.lng();
          let isTransit = false;
          let stepIcon = '🚶';
          let vehicleType = 'walk';

          if (step.transit) {
            isTransit = true;
            const t = step.transit;
            const dep = t.departure_stop;
            if (dep && dep.location) {
              lat = dep.location.lat();
              lng = dep.location.lng();
            }

            const vType = t.line?.vehicle?.type || 'TRANSIT';
            if (vType === 'BUS') { stepIcon = '🚌'; vehicleType = 'bus'; }
            else if (vType === 'TRAM' || vType === 'LIGHT_RAIL') { stepIcon = '🚊'; vehicleType = 'tram'; }
            else if (vType === 'SUBWAY' || vType === 'METRO_RAIL') { stepIcon = '🚇'; vehicleType = 'subway'; }
            else if (vType === 'RAIL' || vType === 'HEAVY_RAIL') { stepIcon = '🚆'; vehicleType = 'train'; }
          }

          let heading = 0;
          try { heading = bearingFromTo(step.start_location, step.end_location); } catch (e) {}
          step.heading = heading;

          const panoId = await getPano(new google.maps.LatLng(lat, lng));
          const img1 = streetViewUrlAt(lat, lng, heading, "500x250", panoId);
          
          // Get second view (looking back at where you came from for context)
          const reverseHeading = (heading + 180) % 360;
          const img2 = streetViewUrlAt(lat, lng, reverseHeading, "500x250", panoId);

          const instructions = generateSimpleInstruction(step, nextStep);
          const landmarks = await findNearbyLandmarks(lat, lng);
          
          const direction = getDetailedDirection(heading);
          const distance = step.distance?.value || 0;

          html += `
            <div class="step ultra-step ${isTransit ? 'transit' : 'walk'}" role="listitem" data-step="${i + 1}">
              <div class="node">${stepIcon}</div>
              <div class="step-content">
                <div class="step-header">
                  <span class="step-number">Step ${i + 1} of ${leg.steps.length}</span>
                  <span class="step-badge ${isTransit ? 'badge-transit' : 'badge-walk'}">
                    ${isTransit ? vehicleType.toUpperCase() : 'WALK'}
                  </span>
                </div>
                
                <div class="ultra-instructions">
                  ${instructions.map((inst, idx) => `
                    <div class="instruction-item">
                      <span class="instruction-number">${idx + 1}</span>
                      <span class="instruction-text">${inst}</span>
                    </div>
                  `).join('')}
                </div>

                ${landmarks.length > 0 ? `
                  <div class="landmarks-hint">
                    <strong>🏛️ Nearby landmarks:</strong> ${landmarks.join(', ')}
                  </div>
                ` : ''}

                <div class="dual-view-container">
                  <div class="view-item">
                    <div class="view-label">${direction.icon} Your direction (${direction.dir})</div>
                    <div class="img-skel">
                      <img src="${img1}" alt="View ahead" loading="lazy"
                           onload="this.parentElement.classList.remove('img-skel')"
                           onerror="this.parentElement.innerHTML='<div class=no-view>Street View unavailable</div>'"/>
                    </div>
                  </div>
                  
                  ${!isTransit ? `
                    <div class="view-item">
                      <div class="view-label">🔄 Context view (behind you)</div>
                      <div class="img-skel">
                        <img src="${img2}" alt="View behind" loading="lazy"
                             onload="this.parentElement.classList.remove('img-skel')"
                             onerror="this.parentElement.innerHTML='<div class=no-view>Street View unavailable</div>'"/>
                      </div>
                    </div>
                  ` : ''}
                </div>

                ${isTransit ? `
                  <div class="transit-details-ultra">
                    <div class="transit-info-row">
                      <span class="info-label">Board at:</span>
                      <span class="info-value">${step.transit.departure_stop?.name || 'Departure'}</span>
                    </div>
                    <div class="transit-info-row">
                      <span class="info-label">Exit at:</span>
                      <span class="info-value">${step.transit.arrival_stop?.name || 'Arrival'}</span>
                    </div>
                    <div class="transit-info-row">
                      <span class="info-label">Duration:</span>
                      <span class="info-value">${step.duration?.text} • ${step.transit.num_stops || 0} stops</span>
                    </div>
                  </div>
                ` : `
                  <div class="walk-details-ultra">
                    <div class="walk-stat">
                      <span class="stat-icon">📏</span>
                      <span class="stat-value">${formatDistance(distance)}</span>
                    </div>
                    <div class="walk-stat">
                      <span class="stat-icon">⏱️</span>
                      <span class="stat-value">${step.duration?.text || 'a few mins'}</span>
                    </div>
                    <div class="walk-stat">
                      <span class="stat-icon">${direction.icon}</span>
                      <span class="stat-value">Head ${direction.dir}</span>
                    </div>
                  </div>
                `}
              </div>
            </div>`;
        }

        stepsEl.innerHTML = html;
        document.getElementById('routeProgress').style.display = 'flex';
        document.getElementById('totalSteps').textContent = `of ${leg.steps.length}`;
        showToast('Route loaded with detailed navigation!', 'success');
        setTimeout(() => {
          document.querySelector('.timeline').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 300);
      });
    }

    function listNearbyStops() {
      const output = document.getElementById('nearby');
      const startVal = document.getElementById('start').value.trim();
      if (!startVal) { showToast('Enter a location first', 'error'); return; }

      output.innerHTML = '<div class="loading-inline"><div class="spinner-sm"></div> Finding stops...</div>';
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({ address: startVal }, (results, status) => {
        if (status !== "OK" || !results[0]) {
          output.innerHTML = '<div class="error-inline">Could not locate address</div>';
          return;
        }

        const loc = results[0].geometry.location;
        map.setCenter(loc); map.setZoom(15);

        placesService.nearbySearch({ location: loc, radius: 800, type: ['transit_station'] }, (places, ps) => {
          if (ps !== google.maps.places.PlacesServiceStatus.OK || !places?.length) {
            output.innerHTML = '<div class="info-inline">No transit stops within 800m</div>';
            return;
          }

          const list = places.slice(0, 8).map(p => {
            const dist = google.maps.geometry.spherical.computeDistanceBetween(loc, p.geometry.location);
            return `
              <div class="nearby-item">
                <span class="nearby-name">${p.name}</span>
                <span class="nearby-dist">${formatDistance(dist)}</span>
              </div>`;
          }).join('');

          output.innerHTML = `
            <div class="nearby-container">
              <div class="nearby-header">🚏 Nearby Stops (within 800m)</div>
              ${list}
            </div>`;
          showToast(`Found ${places.length} nearby stops`, 'success');
        });
      });
    }
  </script>

  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA&libraries=places,geometry&callback=initMap"></script>
</body>
