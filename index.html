<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapNav – Public Transport MVP</title>
  <link rel="icon" href="snapnav.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=100" />
</head>

<body class="theme-dark">
  <canvas id="bg-orbs" aria-hidden="true"></canvas>

  <header>
    <img src="snapnav.svg" alt="SnapNav logo" class="logo-mark" />
    <h1 class="logo">SnapNav</h1>
    <span class="badge">Transit-first</span>
    <div class="spacer"></div>
    <button class="chip" id="toggleTheme" title="Toggle light/dark">☀️/🌙</button>
  </header>

  <main>
    <section class="card" id="controls">
      <div class="stack">
        <div class="quick-saves">
          <span class="qs-label">Saved places:</span>
          <button class="qs" data-target="start" data-value="Dublin City University, Dublin">🏫 Uni</button>
          <button class="qs" data-target="dest"  data-value="Heuston Station, Dublin">🚉 Heuston</button>
          <button class="qs" data-target="dest"  data-value="Aviva Stadium, Dublin">🏟️ Stadium</button>
          <button class="qs" data-target="dest"  data-value="Temple Bar, Dublin">🍻 Temple Bar</button>
        </div>

        <div>
          <label for="start">Start (type or use current location)</label>
          <input id="start" placeholder="e.g. O'Connell Street, Dublin" />
          <div class="row">
            <button class="btn" id="useHere">Use my current location</button>
            <button class="btn ghost" id="swapBtn">⇄ Swap</button>
          </div>
          <div class="muted" id="startNote"></div>
        </div>

        <div>
          <label for="dest">Destination</label>
          <input id="dest" placeholder="e.g. Heuston Station" />
        </div>

        <div class="row">
          <div class="grow">
            <label for="pref">Transit preference</label>
            <select id="pref">
              <option value="default">Best route</option>
              <option value="FEWER_TRANSFERS">Fewer transfers</option>
              <option value="LESS_WALKING">Less walking</option>
            </select>
          </div>
          <div class="grow">
            <label for="depart">When</label>
            <select id="depart">
              <option value="now">Leave now</option>
              <option value="arrive">Arrive by…</option>
              <option value="departAt">Depart at…</option>
            </select>
          </div>
          <div class="grow">
            <label for="time">Time</label>
            <input id="time" type="datetime-local" />
          </div>
        </div>

        <div class="filters">
          <span class="muted">Show:</span>
          <label class="toggle"><input type="checkbox" id="filterWalk" checked /> Walking</label>
          <label class="toggle"><input type="checkbox" id="filterTransit" checked /> Transit</label>
        </div>

        <div class="row">
          <button class="btn" id="routeBtn">Get transit route</button>
          <button class="btn secondary" id="nearbyBtn">Nearby stops</button>
        </div>

        <p class="muted">Shows Street View for each step and tells you where to find the bus stop.</p>
        <div id="nearby" class="muted"></div>
      </div>
    </section>

    <section class="card">
      <div id="map"></div>
      <h3 class="section-title">Visual Transit Timeline</h3>
      <div id="steps" class="timeline muted">Enter start + destination to see transit steps…</div>
    </section>
  </main>

  <footer>
    Uses Google Maps JavaScript API, Places API, Directions (Transit) & Street View Static API.
  </footer>

  <script>
    const apiKey = "AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA";
    let map, directionsService, directionsRenderer, lastSteps = [];

    document.addEventListener("DOMContentLoaded", () => {
      // Theme toggle
      const btn = document.getElementById("toggleTheme");
      btn.addEventListener("click", () => {
        const b = document.body;
        b.classList.toggle("theme-dark");
        b.classList.toggle("theme-light");
      });

      // Floating background animation
      const canvas = document.getElementById("bg-orbs");
      const ctx = canvas.getContext("2d");
      let w, h, orbs=[];
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth+"px"; canvas.style.height = innerHeight+"px";
        orbs = new Array(14).fill(0).map(()=>({
          x: Math.random()*w, y: Math.random()*h, r:(20+Math.random()*60)*dpr,
          hue: 200+Math.random()*80, a:0.06+Math.random()*0.1,
          vx:(Math.random()-0.5)*0.4*dpr, vy:(Math.random()-0.5)*0.4*dpr
        }));
      }
      function tick(){
        ctx.clearRect(0,0,w,h);
        for(const o of orbs){
          o.x+=o.vx; o.y+=o.vy;
          if(o.x<-o.r) o.x=w+o.r;
          if(o.x>w+o.r) o.x=-o.r;
          if(o.y<-o.r) o.y=h+o.r;
          if(o.y>h+o.r) o.y=-o.r;
          const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
          g.addColorStop(0,`hsla(${o.hue},85%,60%,${o.a})`);
          g.addColorStop(1,`hsla(${o.hue},85%,60%,0)`);
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener("resize",resize);
      resize(); tick();
    });

    // Google Map init
    function initMap(){
      map = new google.maps.Map(document.getElementById("map"),{
        center:{lat:53.3498,lng:-6.2603},zoom:13,
        mapTypeControl:false,streetViewControl:false
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({map});
      new google.maps.places.Autocomplete(document.getElementById("start"));
      new google.maps.places.Autocomplete(document.getElementById("dest"));
      document.getElementById("routeBtn").onclick = buildRoute;
      document.getElementById("useHere").onclick = getLocation;
      document.getElementById("swapBtn").onclick = ()=>{const a=start.value,b=dest.value;start.value=b;dest.value=a;};
    }

    function getLocation(){
      const note=document.getElementById("startNote");
      if(!navigator.geolocation)return note.textContent="No geolocation.";
      note.textContent="Locating...";
      navigator.geolocation.getCurrentPosition(p=>{
        const {latitude,longitude}=p.coords;
        const g=new google.maps.Geocoder();
        g.geocode({location:{lat:latitude,lng:longitude}},(r,s)=>{
          if(s==="OK"&&r[0]){start.value=r[0].formatted_address;note.textContent="Got it!";}
        });
      });
    }

    function bearing(a,b){return google.maps.geometry.spherical.computeHeading(a,b);}
    function dist(a,b){return google.maps.geometry.spherical.computeDistanceBetween(a,b);}
    function svUrl(lat,lng,heading=0,pano=null){
      return pano?
        `https://maps.googleapis.com/maps/api/streetview?size=380x160&pano=${pano}&heading=${heading}&key=${apiKey}`:
        `https://maps.googleapis.com/maps/api/streetview?size=380x160&location=${lat},${lng}&heading=${heading}&key=${apiKey}`;
    }

    async function buildRoute(){
      const startV=start.value.trim(),destV=dest.value.trim();
      if(!startV||!destV)return steps.textContent="Enter both points.";
      directionsService.route({
        origin:startV,destination:destV,travelMode:"TRANSIT"
      },async(res,st)=>{
        if(st!=="OK")return steps.textContent="Error: "+st;
        directionsRenderer.setDirections(res);
        const leg=res.routes[0].legs[0],sv=new google.maps.StreetViewService();
        lastSteps=[];
        for(const step of leg.steps){
          const isT=!!step.transit; let anchor=step.end_location;
          let stop=step.transit?.departure_stop?.location||null;
          let title=step.instructions.replace(/<[^>]+>/g,""),
              subtitle=`${step.distance?.text||""} • ${step.duration?.text||""}`,
              badge=null;
          if(isT){
            const t=step.transit; anchor=stop||step.end_location;
            badge=t.line?.short_name||t.line?.name||"Line";
            const head=t.headsign?` → ${t.headsign}`:"";
            const stops=t.num_stops?`${t.num_stops} stops`:"stops";
            title=`Take ${badge}${head}`;
            subtitle=`${t.departure_stop?.name||"Dep"} → ${t.arrival_stop?.name||"Arr"} • ${stops}`;
          }
          const pano=await new Promise(r=>{
            sv.getPanorama({location:anchor,radius:80,source:"OUTDOOR"},(d,s)=>{
              if(s==="OK"&&d?.location?.pano)r(d);
              else sv.getPanorama({location:anchor,radius:150,source:"OUTDOOR"},(d2,s2)=>r(s2==="OK"?d2:null));
            });
          });
          let pid=null,plat=null,heading=0;
          if(pano){pid=pano.location.pano;plat=pano.location.latLng;}
          if(isT&&stop&&plat)heading=bearing(plat,stop);
          else heading=bearing(step.start_location,step.end_location);
          const img=svUrl(anchor.lat(),anchor.lng(),heading,pid);
          let note="";
          if(isT&&stop&&(plat||anchor)){
            const from=plat||anchor;const d=Math.round(dist(from,stop));
            note=`🧭 Bus stop is ~${d} m ahead.`;
          }
          lastSteps.push({isT,title,subtitle,img,badge,note});
        }
        renderSteps();
      });
    }

    function renderSteps(){
      const walk=document.getElementById("filterWalk")?.checked??true;
      const tran=document.getElementById("filterTransit")?.checked??true;
      const palette=["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#84cc16","#f97316"];
      const colorFor=t=>palette[Math.abs([...t].reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length];
      const filtered=lastSteps.filter(s=>(s.isT&&tran)||(!s.isT&&walk));
      steps.innerHTML=filtered.map((s,i)=>`
      <div class="step ${s.isT?"transit":"walk"}">
        <div class="node"></div>
        <div class="img-wrap img-skel">
          <span class="dir-chip">🧭 Landmark</span>
          <img src="${s.img}" loading="lazy" onload="this.parentElement.classList.remove('img-skel')">
        </div>
        <div>
          <div class="title"><strong>Step ${i+1}:</strong> ${s.badge?`<span class='route-badge' style='--route:${colorFor(s.badge)}'>${s.badge}</span>`:""} ${s.title}</div>
          <div class="subtitle">${s.subtitle}</div>
          ${s.note?`<div class='extra-note'>${s.note}</div>`:""}
        </div>
      </div>`).join("")||"<span class='muted'>No steps.</span>";
    }
  </script>

  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA&libraries=places,geometry&callback=initMap"></script>
</body>
</html>
