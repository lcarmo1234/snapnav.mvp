<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapNav – Public Transport MVP</title>
  <link rel="icon" href="snapnav.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=200" />
</head>

<body class="theme-dark">
  <!-- Animated background -->
  <canvas id="bg-orbs" aria-hidden="true"></canvas>

  <header>
    <img src="snapnav.svg" alt="SnapNav logo" class="logo-mark" />
    <h1 class="logo">SnapNav</h1>
    <span class="badge">Transit-first</span>
    <div class="spacer"></div>
    <button class="chip" id="toggleTheme" title="Toggle light/dark">☀️/🌙</button>
  </header>

  <main>
    <section class="card" id="controls">
      <div class="stack">
        <div class="quick-saves">
          <span class="qs-label">Saved places:</span>
          <button class="qs" data-target="start" data-value="Dublin City University, Dublin">🏫 Uni</button>
          <button class="qs" data-target="dest"  data-value="Heuston Station, Dublin">🚉 Heuston</button>
          <button class="qs" data-target="dest"  data-value="Aviva Stadium, Dublin">🏟️ Stadium</button>
          <button class="qs" data-target="dest"  data-value="Temple Bar, Dublin">🍻 Temple Bar</button>
        </div>

        <div>
          <label for="start">Start (type or use current location)</label>
          <input id="start" placeholder="e.g. O'Connell Street, Dublin" />
          <div class="row">
            <button class="btn" id="useHere">Use my current location</button>
            <button class="btn ghost" id="swapBtn">⇄ Swap</button>
          </div>
          <div class="muted" id="startNote"></div>
        </div>

        <div>
          <label for="dest">Destination</label>
          <input id="dest" placeholder="e.g. Heuston Station" />
        </div>

        <div class="row">
          <div class="grow">
            <label for="pref">Transit preference</label>
            <select id="pref">
              <option value="default">Best route</option>
              <option value="FEWER_TRANSFERS">Fewer transfers</option>
              <option value="LESS_WALKING">Less walking</option>
            </select>
          </div>
          <div class="grow">
            <label for="depart">When</label>
            <select id="depart">
              <option value="now">Leave now</option>
              <option value="arrive">Arrive by…</option>
              <option value="departAt">Depart at…</option>
            </select>
          </div>
          <div class="grow">
            <label for="time">Time</label>
            <input id="time" type="datetime-local" />
          </div>
        </div>

        <div class="filters">
          <span class="muted">Show:</span>
          <label class="toggle"><input type="checkbox" id="filterWalk" checked /> Walking</label>
          <label class="toggle"><input type="checkbox" id="filterTransit" checked /> Transit</label>
        </div>

        <div class="row">
          <button class="btn" id="routeBtn">Get transit route</button>
          <button class="btn secondary" id="nearbyBtn">Nearby stops</button>
        </div>

        <p class="muted">Shows Street View for each step and tells you where the bus stop is.</p>
        <div id="nearby" class="muted"></div>
      </div>
    </section>

    <section class="card">
      <div id="map"></div>
      <h3 class="section-title">Visual Transit Timeline</h3>
      <div id="steps" class="timeline muted">Enter start + destination to see transit steps…</div>
    </section>
  </main>

  <footer>
    Uses Google Maps JavaScript API, Places API, Directions (Transit) & Street View Static API.
  </footer>

  <script>
    // ==== CONFIG
    const apiKey = "AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA"; // your key
    let map, directionsService, directionsRenderer, lastSteps = [];

    // ===== Theme + background orbs
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("toggleTheme").addEventListener("click", () => {
        const b = document.body;
        b.classList.toggle("theme-dark");
        b.classList.toggle("theme-light");
      });

      const canvas = document.getElementById("bg-orbs");
      const ctx = canvas.getContext("2d");
      let w, h, orbs=[];
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth+"px"; canvas.style.height = innerHeight+"px";
        orbs = new Array(14).fill(0).map(()=>({
          x: Math.random()*w, y: Math.random()*h, r:(20+Math.random()*60)*dpr,
          hue: 200+Math.random()*80, a:0.06+Math.random()*0.1,
          vx:(Math.random()-0.5)*0.4*dpr, vy:(Math.random()-0.5)*0.4*dpr
        }));
      }
      function tick(){
        ctx.clearRect(0,0,w,h);
        for(const o of orbs){
          o.x+=o.vx; o.y+=o.vy;
          if(o.x<-o.r) o.x=w+o.r; if(o.x>w+o.r) o.x=-o.r;
          if(o.y<-o.r) o.y=h+o.r; if(o.y>h+o.r) o.y=-o.r;
          const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
          g.addColorStop(0,`hsla(${o.hue},85%,60%,${o.a})`);
          g.addColorStop(1,`hsla(${o.hue},85%,60%,0)`);
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener("resize",resize);
      resize(); tick();
    });

    // ===== Map init
    function initMap(){
      map = new google.maps.Map(document.getElementById("map"),{
        center:{lat:53.3498,lng:-6.2603}, zoom:13, mapTypeControl:false, streetViewControl:false
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map });

      new google.maps.places.Autocomplete(document.getElementById("start"));
      new google.maps.places.Autocomplete(document.getElementById("dest"));

      document.getElementById("routeBtn").onclick = buildTransitRoute;
      document.getElementById("useHere").onclick  = useCurrentLocation;
      document.getElementById("swapBtn").onclick  = () => {
        const a = document.getElementById("start");
        const b = document.getElementById("dest");
        const t = a.value; a.value = b.value; b.value = t;
      };
      document.getElementById("nearbyBtn").onclick = listNearbyStops;

      // filter checkboxes re-render
      document.getElementById("filterWalk").addEventListener("change", renderStepsFromCache);
      document.getElementById("filterTransit").addEventListener("change", renderStepsFromCache);
    }

    // ===== Utilities
    function useCurrentLocation(){
      const note = document.getElementById("startNote");
      if(!navigator.geolocation){ note.textContent = "Geolocation not supported."; return; }
      note.textContent = "Finding your location…";
      navigator.geolocation.getCurrentPosition(pos=>{
        const { latitude, longitude } = pos.coords;
        const g = new google.maps.Geocoder();
        g.geocode({location:{lat:latitude,lng:longitude}}, (res, st) => {
          if(st==="OK" && res[0]){ document.getElementById("start").value = res[0].formatted_address; note.textContent="Using your current location."; }
        });
      }, ()=> note.textContent="Couldn't get location.");
    }
    function bearing(a,b){ return google.maps.geometry.spherical.computeHeading(a,b); }
    function dist(a,b){ return google.maps.geometry.spherical.computeDistanceBetween(a,b); }
    function svUrl(lat,lng,heading=0,pano=null){
      const fov=70,pitch=0;
      return pano
        ?`https://maps.googleapis.com/maps/api/streetview?size=380x160&pano=${pano}&heading=${heading}&fov=${fov}&pitch=${pitch}&key=${apiKey}`
        :`https://maps.googleapis.com/maps/api/streetview?size=380x160&location=${lat},${lng}&heading=${heading}&fov=${fov}&pitch=${pitch}&key=${apiKey}`;
    }
    function dirWord(deg){
      let d=((deg+540)%360)-180, ad=Math.abs(d);
      if(ad<=20)return{w:"ahead",a:"⬆︎"}; if(ad<=60)return{w:d>0?"slightly right":"slightly left",a:d>0?"↗︎":"↖︎"};
      if(ad<=120)return{w:d>0?"to the right":"to the left",a:d>0?"→":"←"}; if(ad<=160)return{w:d>0?"back-right":"back-left",a:d>0?"↘︎":"↙︎"};
      return{w:"behind",a:"⬇︎"};
    }
    function colorFor(text){
      const palette=["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#84cc16","#f97316"];
      let hash=0; for(let i=0;i<text.length;i++) hash=(hash*31 + text.charCodeAt(i))|0;
      return palette[Math.abs(hash)%palette.length];
    }

    // ===== Routing
    async function buildTransitRoute(){
      const startVal = document.getElementById("start").value.trim();
      const destVal  = document.getElementById("dest").value.trim();
      const pref     = document.getElementById("pref").value;
      const depart   = document.getElementById("depart").value;
      const timeVal  = document.getElementById("time").value;

      const stepsEl  = document.getElementById("steps");
      if(!startVal || !destVal){ stepsEl.textContent="Enter start and destination."; return; }

      const req = { origin:startVal, destination:destVal, travelMode:"TRANSIT", transitOptions:{} };
      const dt = timeVal ? new Date(timeVal) : new Date();
      if (depart === "arrive") req.transitOptions.arrivalTime = dt; else req.transitOptions.departureTime = dt;
      if (pref==="FEWER_TRANSFERS" || pref==="LESS_WALKING") req.transitOptions.routingPreference = google.maps.TransitRoutePreference[pref];

      directionsService.route(req, async (res, st) => {
        if(st!=="OK"){ stepsEl.textContent = "Route error: " + st; return; }
        directionsRenderer.setDirections(res);
        const leg = res.routes[0].legs[0];
        const sv = new google.maps.StreetViewService();
        lastSteps = [];

        for(const step of leg.steps){
          const isTransit = !!step.transit;
          let anchor = step.end_location;
          let stopLL = step.transit?.departure_stop?.location || null;

          let title = step.instructions.replace(/<[^>]+>/g,"");
          let subtitle = `${step.distance?.text||""} • ${step.duration?.text||""}`;
          let badge = null;

          if (isTransit){
            const t = step.transit;
            badge = t.line?.short_name || t.line?.name || "Line";
            anchor = stopLL || step.end_location;
            const headsign = t.headsign ? ` → ${t.headsign}` : "";
            const stops = t.num_stops ? `${t.num_stops} stops` : "stops";
            title = `Take ${badge}${headsign}`;
            subtitle = `${t.departure_stop?.name||"Departure"} → ${t.arrival_stop?.name||"Arrival"} • ${stops}`;
          }

          const panoData = await new Promise(r=>{
            sv.getPanorama({location:anchor, radius:80, source:"OUTDOOR"}, (d,s)=>{
              if(s==="OK" && d?.location?.pano) r(d);
              else sv.getPanorama({location:anchor, radius:150, source:"OUTDOOR"}, (d2,s2)=>r(s2==="OK"?d2:null));
            });
          });

          let heading=0, pid=null, platlng=null;
          if(panoData){ pid=panoData.location.pano; platlng=panoData.location.latLng; }
          if(isTransit && stopLL && platlng) heading = bearing(platlng, stopLL);
          else heading = bearing(step.start_location, step.end_location);

          const img = svUrl(anchor.lat(), anchor.lng(), heading, pid);

          let note = "";
          if(isTransit && stopLL && (platlng || anchor)){
            const from = platlng || anchor;
            const d = Math.round(dist(from, stopLL));
            const rel = dirWord(bearing(from, stopLL) - heading);
            note = `🧭 Bus stop is ~${d} m ${rel.w}.`;
          }

          lastSteps.push({ isTransit, title, subtitle, img, badge, note });
        }

        renderStepsFromCache();
      });
    }

    function renderStepsFromCache(){
      const stepsEl = document.getElementById("steps");
      const showWalk = document.getElementById("filterWalk")?.checked ?? true;
      const showTrans= document.getElementById("filterTransit")?.checked ?? true;

      const filtered = lastSteps.filter(s => (s.isTransit && showTrans) || (!s.isTransit && showWalk));
      if(!filtered.length){ stepsEl.innerHTML = '<span class="muted">No steps with current filters.</span>'; return; }

      const html = filtered.map((s, i) => `
        <div class="step ${s.isTransit ? "transit" : "walk"}">
          <div class="node"></div>
          <div class="img-wrap img-skel">
            <span class="dir-chip"><span class="arrow">🧭</span>Landmark</span>
            <img src="${s.img}" alt="Step ${i+1}" loading="lazy"
                 onload="this.parentElement.classList.remove('img-skel')">
          </div>
          <div>
            <div class="title"><strong>Step ${i+1}:</strong>
              ${s.badge ? `<span class="route-badge" style="--route:${colorFor(s.badge)}">${s.badge}</span>` : ""}
              ${s.title}
            </div>
            <div class="subtitle">${s.subtitle}</div>
            ${s.note ? `<div class="extra-note">${s.note}</div>` : ""}
          </div>
        </div>
      `).join("");

      stepsEl.innerHTML = html;
    }

    function listNearbyStops(){
      const out = document.getElementById("nearby");
      const startVal = document.getElementById("start").value.trim();
      if(!startVal){ out.textContent = "Enter or set a start location first."; return; }

      const service = new google.maps.places.PlacesService(map);
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({address:startVal}, (results,status)=>{
        if(status!=="OK" || !results[0]){ out.textContent='Could not locate start.'; return; }
        const loc = results[0].geometry.location;
        map.setCenter(loc); map.setZoom(15);
        const req = { location: loc, radius: 800, type: ['transit_station'] };
        service.nearbySearch(req,(places, ps)=>{
          if(ps!==google.maps.places.PlacesServiceStatus.OK || !places?.length){
            out.textContent='No nearby stops within 800m.'; return;
          }
          const top = places.slice(0,8).map(p=>`• ${p.name}`).join('<br>');
          out.innerHTML = `<strong>Nearby stops (≤800m):</strong><br>${top}`;
        });
      });
    }
  </script>

  <!-- Google Maps JS (make sure both libraries are present) -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA&libraries=places,geometry&callback=initMap"></script>
</body>
</html>
