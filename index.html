<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device=device-width, initial-scale=1" />
  <title>SnapNav – Public Transport MVP</title>
  <link rel="stylesheet" href="style.css?v=20" />
</head>
<body class="theme-dark">
  <!-- Floating animated background -->
  <canvas id="bg-orbs" aria-hidden="true"></canvas>

  <header>
    <h1 class="logo">SnapNav</h1>
    <span class="badge">Transit-first</span>
    <div class="spacer"></div>
    <button class="chip" id="toggleTheme" title="Toggle theme (L/D)">☀️/🌙</button>
  </header>

  <main>
    <!-- Controls -->
    <section class="card" id="controls">
      <div class="stack">
        <div>
          <label for="start">Start (type or use current location)</label>
          <input id="start" placeholder="e.g. O'Connell Street, Dublin" />
          <button class="btn" id="useHere">Use my current location</button>
          <div class="muted" id="startNote"></div>
        </div>

        <div>
          <label for="dest">Destination</label>
          <input id="dest" placeholder="e.g. Heuston Station" />
        </div>

        <div class="row">
          <div class="grow">
            <label for="pref">Transit preference</label>
            <select id="pref">
              <option value="default">Best route</option>
              <option value="FEWER_TRANSFERS">Fewer transfers</option>
              <option value="LESS_WALKING">Less walking</option>
            </select>
          </div>
          <div class="grow">
            <label for="depart">When</label>
            <select id="depart">
              <option value="now">Leave now</option>
              <option value="arrive">Arrive by… (uses time below)</option>
              <option value="departAt">Depart at… (uses time below)</option>
            </select>
          </div>
          <div class="grow">
            <label for="time">Time</label>
            <input id="time" type="datetime-local" />
          </div>
        </div>

        <div class="row">
          <button class="btn" id="routeBtn">Get transit route</button>
          <button class="btn secondary" id="nearbyBtn" title="Find nearby stops">Nearby stops</button>
        </div>

        <p class="muted">Fetches <strong>TRANSIT</strong> routes and shows a visual timeline with Street View at key steps.</p>
        <div id="nearby" class="muted"></div>
      </div>
    </section>

    <!-- Map + Steps -->
    <section class="card">
      <div id="map"></div>
      <h3 class="section-title">Visual Transit Timeline</h3>
      <div id="steps" class="timeline muted">Enter start + destination to see transit steps…</div>
    </section>
  </main>

  <!-- Quick actions dock -->
  <div class="dock">
    <button class="fab" id="fabLocate" title="Use my current location">📍</button>
    <button class="fab" id="fabTop" title="Scroll to top">⬆️</button>
  </div>

  <footer>
    Uses Google Maps JavaScript API, Places API, <strong>Directions API (TRANSIT)</strong>, and Street View Static API.
  </footer>

  <script>
    // ===== CONFIG: your key (already used below in Maps loader) =====
    const apiKey = "AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA";

    // ===== THEME TOGGLE =====
    const toggleThemeBtn = document.getElementById('toggleTheme');
    toggleThemeBtn?.addEventListener('click', ()=>{
      const b = document.body;
      b.classList.toggle('theme-dark');
      b.classList.toggle('theme-light');
      // store preference
      localStorage.setItem('snapnav-theme', b.classList.contains('theme-dark') ? 'dark' : 'light');
    });
    // restore theme
    (function(){
      const saved = localStorage.getItem('snapnav-theme');
      if(saved === 'light'){ document.body.classList.remove('theme-dark'); document.body.classList.add('theme-light'); }
    })();

    // ===== FLOATING ORBS BACKGROUND (tiny canvas animation) =====
    (function(){
      const canvas = document.getElementById('bg-orbs');
      const ctx = canvas.getContext('2d');
      let w, h, dpr, orbs;

      function resize(){
        dpr = window.devicePixelRatio || 1;
        w = canvas.width  = innerWidth  * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width  = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        // build orbs
        const N = 16;
        orbs = new Array(N).fill(0).map((_,i)=>({
          x: Math.random()*w, y: Math.random()*h,
          r: (20 + Math.random()*80) * dpr,
          hue: 200 + Math.random()*80,
          a: 0.06 + Math.random()*0.10,
          vx: (Math.random()*0.6 - 0.3) * dpr,
          vy: (Math.random()*0.6 - 0.3) * dpr,
        }));
      }
      function tick(){
        ctx.clearRect(0,0,w,h);
        for(const o of orbs){
          o.x += o.vx; o.y += o.vy;
          if(o.x < -o.r) o.x = w + o.r;
          if(o.x >  w+o.r) o.x = -o.r;
          if(o.y < -o.r) o.y = h + o.r;
          if(o.y >  h+o.r) o.y = -o.r;
          const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
          grad.addColorStop(0, `hsla(${o.hue}, 85%, 60%, ${o.a})`);
          grad.addColorStop(1, `hsla(${o.hue}, 85%, 60%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener('resize', resize);
      resize(); tick();
    })();

    // ===== MAPS + TRANSIT =====
    let map, directionsService, directionsRenderer, startAutocomplete, destAutocomplete;

    function initMap(){
      map = new google.maps.Map(document.getElementById('map'),{
        center:{lat:53.3498,lng:-6.2603}, // Dublin
        zoom:13, mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
        styles: [ { featureType:"poi", stylers:[{visibility:"off"}] } ]
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({map, suppressMarkers:true, polylineOptions:{strokeColor:"#69a6ff"}});

      const startInput = document.getElementById('start');
      const destInput  = document.getElementById('dest');
      startAutocomplete = new google.maps.places.Autocomplete(startInput,{fields:["place_id","geometry","name"]});
      destAutocomplete  = new google.maps.places.Autocomplete(destInput,{fields:["place_id","geometry","name"]});

      document.getElementById('routeBtn').addEventListener('click', buildTransitRoute);
      document.getElementById('useHere').addEventListener('click', useCurrentLocationAsStart);
      document.getElementById('nearbyBtn').addEventListener('click', listNearbyStops);

      // Dock quick actions
      document.getElementById('fabLocate').addEventListener('click', useCurrentLocationAsStart);
      document.getElementById('fabTop').addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
    }

    function streetViewUrlAt(lat, lng, heading = 0, size = "340x140", panoId = null) {
      const fov = 90;  const pitch = 0;
      if (panoId) {
        return `https://maps.googleapis.com/maps/api/streetview?size=${size}&pano=${panoId}&heading=${heading}&fov=${fov}&pitch=${pitch}&key=${apiKey}`;
      }
      return `https://maps.googleapis.com/maps/api/streetview?size=${size}&location=${lat},${lng}&heading=${heading}&fov=${fov}&pitch=${pitch}&key=${apiKey}`;
    }
    function bearingFromTo(aLatLng, bLatLng){
      return google.maps.geometry.spherical.computeHeading(aLatLng, bLatLng);
    }

    function useCurrentLocationAsStart(){
      const note = document.getElementById('startNote');
      if(!navigator.geolocation){ note.textContent='Geolocation not supported.'; return; }
      note.textContent='Finding your location…';
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude, longitude} = pos.coords;
        const latlng = new google.maps.LatLng(latitude, longitude);
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({location:latlng},(results,status)=>{
          if(status==='OK' && results[0]){
            document.getElementById('start').value = results[0].formatted_address;
            note.textContent='Using your current location.';
          }else{
            document.getElementById('start').value = `${latitude}, ${longitude}`;
            note.textContent='Using your coordinates.';
          }
        });
      },()=>{ note.textContent = "Couldn't get location (permission denied?)."; });
    }

    async function buildTransitRoute(){
      const start = document.getElementById('start').value.trim();
      const dest  = document.getElementById('dest').value.trim();
      const pref  = document.getElementById('pref').value;
      const when  = document.getElementById('depart').value;
      const timeVal = document.getElementById('time').value;
      const stepsEl = document.getElementById('steps');

      if(!start || !dest){ stepsEl.innerHTML='<span class="muted">Please enter start and destination.</span>'; return; }

      const req = { origin:start, destination:dest, travelMode: google.maps.TravelMode.TRANSIT, transitOptions: {} };
      if(pref==='FEWER_TRANSFERS' || pref==='LESS_WALKING'){
        req.transitOptions.routingPreference = google.maps.TransitRoutePreference[pref];
      }
      const dt = timeVal ? new Date(timeVal) : new Date();
      if(when==='arrive'){ req.transitOptions.arrivalTime = dt; }
      else if(when==='departAt'){ req.transitOptions.departureTime = dt; }
      else { req.transitOptions.departureTime = new Date(); }

      directionsService.route(req, async (result,status)=>{
        if(status!=="OK"){ stepsEl.innerHTML = `<span class='muted'>Routing error: ${status}</span>`; return; }
        directionsRenderer.setDirections(result);
        const leg = result.routes[0].legs[0];
        let html = "";

        const sv = new google.maps.StreetViewService();
        const getPano = (latLng) => new Promise((resolve)=>{
          sv.getPanorama({ location: latLng, radius: 35, source: google.maps.StreetViewSource.OUTDOOR },
            (data, st) => {
              if (st === google.maps.StreetViewStatus.OK && data?.location?.pano) resolve(data.location.pano);
              else {
                sv.getPanorama({ location: latLng, radius: 80, source: google.maps.StreetViewSource.OUTDOOR },
                  (data2, st2) => resolve(st2 === google.maps.StreetViewStatus.OK && data2?.location?.pano ? data2.location.pano : null)
                );
              }
            }
          );
        });

        for (let i = 0; i < leg.steps.length; i++){
          const step = leg.steps[i];
          let lat = step.end_location.lat();
          let lng = step.end_location.lng();
          let title = step.instructions.replace(/<[^>]*>?/gm,'');
          let subtitle = `${step.distance?.text||''} • ${step.duration?.text||''}`;
          let isTransit = false;

          if(step.transit){
            isTransit = true;
            const t = step.transit;
            const dep = t.departure_stop; const arr = t.arrival_stop;
            if(dep && dep.location){ lat = dep.location.lat(); lng = dep.location.lng(); }
            const line = t.line?.short_name || t.line?.name || 'Line';
            const headsign = t.headsign ? ` → ${t.headsign}` : '';
            const stops = t.num_stops ? `${t.num_stops} stops` : '';
            title = `Take <span class='line'>${line}</span>${headsign}`;
            subtitle = `${dep?.name||'Departure'} → ${arr?.name||'Arrival'} • ${stops}`;
          }

          let heading = 0;
          try { heading = bearingFromTo(step.start_location, step.end_location); } catch(e){}

          const panoId = await getPano(new google.maps.LatLng(lat, lng));
          const img = streetViewUrlAt(lat, lng, heading, "340x140", panoId);

          html += `
            <div class="step ${isTransit ? 'transit' : 'walk'}">
              <div class="node"></div>
              <div class="img-skel">
                <img src="${img}" alt="Step ${i+1} preview" loading="lazy"
                     onload="this.parentElement.classList.remove('img-skel')"
                     onerror="this.replaceWith((()=>{const d=document.createElement('div');d.className='muted';d.style.padding='12px';d.style.border='1px solid #1f2937';d.style.borderRadius='10px';d.style.display='grid';d.style.placeItems='center';d.textContent='No Street View here';return d;})())"/>
              </div>
              <div>
                <div class="title"><strong>Step ${i+1}:</strong> ${title}</div>
                <div class="subtitle">${subtitle}</div>
              </div>
            </div>`;
        }

        stepsEl.innerHTML = html || '<span class="muted">No steps returned.</span>';
      });
    }

    function listNearbyStops(){
      const output = document.getElementById('nearby');
      const startVal = document.getElementById('start').value.trim();
      if(!startVal){ output.textContent = 'Enter or set a start location first.'; return; }

      const service = new google.maps.places.PlacesService(map);
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({address:startVal}, (results,status)=>{
        if(status!=="OK" || !results[0]){ output.textContent='Could not locate start.'; return; }
        const loc = results[0].geometry.location;
        map.setCenter(loc); map.setZoom(15);

        const request = { location: loc, radius: 800, type: ['transit_station'] };
        service.nearbySearch(request,(places, ps)=>{
          if(ps!==google.maps.places.PlacesServiceStatus.OK || !places?.length){ output.textContent='No nearby stops within 800m.'; return; }
          const top = places.slice(0,8).map(p=>`• ${p.name}`).join('<br>');
          output.innerHTML = `<strong>Nearby stops (≤800m):</strong><br>${top}`;
        });
      });
    }
  </script>

  <!-- Load Maps JS (with Places + Geometry) and start app -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA&libraries=places,geometry&callback=initMap"></script>
</body>
</html>
