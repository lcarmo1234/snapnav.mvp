<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapNav – Visual Transit Navigation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark">
  <canvas id="bg-orbs" aria-hidden="true"></canvas>

  <header>
    <h1 class="logo">SnapNav</h1>
    <span class="badge">Simple Mode</span>
    <div class="spacer"></div>
    <button class="chip" id="toggleTheme">
      <span class="theme-icon">☀️</span>
    </button>
  </header>

  <main>
    <section class="card controls-card">
      <div class="stack">
        <div>
          <label for="start">Starting Point</label>
          <input id="start" placeholder="e.g. O'Connell Street, Dublin" />
        </div>

        <div>
          <label for="dest">Destination</label>
          <input id="dest" placeholder="e.g. Heuston Station" />
        </div>

        <div class="row action-row">
          <button class="btn btn-primary" id="routeBtn">
            🚌 Get Route
          </button>
        </div>

        <div id="routeSummary" class="route-summary"></div>
      </div>
    </section>

    <section class="card map-card">
      <div id="map"></div>
      
      <div class="timeline-header">
        <h3 class="section-title">Visual Navigation Guide</h3>
      </div>
      
      <div id="steps" class="timeline">
        <div class="empty-state">
          <div class="empty-icon">🗺️</div>
          <p class="empty-title">Ready to navigate?</p>
          <p class="empty-subtitle">Enter your start and destination</p>
        </div>
      </div>

      <div id="loadingSteps" class="loading-state" style="display:none;">
        <div class="spinner"></div>
        <p>Finding your route...</p>
      </div>
    </section>
  </main>

  <div class="dock">
    <button class="fab" id="fabTop">⬆️</button>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <footer>
    <div class="footer-content">
      <p>Powered by Google Maps APIs</p>
    </div>
  </footer>

  <script>
    const apiKey = "AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA";

    function showToast(message, type = 'info') {
      console.log('Toast:', message);
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Theme toggle
    document.getElementById('toggleTheme')?.addEventListener('click', () => {
      document.body.classList.toggle('theme-dark');
      document.body.classList.toggle('theme-light');
      const isDark = document.body.classList.contains('theme-dark');
      document.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
    });

    // Background animation
    (function() {
      const canvas = document.getElementById('bg-orbs');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h, orbs;

      function resize() {
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        orbs = new Array(12).fill(0).map(() => ({
          x: Math.random() * w, y: Math.random() * h,
          r: 30 + Math.random() * 70,
          hue: 200 + Math.random() * 60,
          a: 0.05 + Math.random() * 0.08,
          vx: Math.random() * 0.4 - 0.2,
          vy: Math.random() * 0.4 - 0.2,
        }));
      }

      function tick() {
        ctx.clearRect(0, 0, w, h);
        for (const o of orbs) {
          o.x += o.vx; o.y += o.vy;
          if (o.x < -o.r) o.x = w + o.r;
          if (o.x > w + o.r) o.x = -o.r;
          if (o.y < -o.r) o.y = h + o.r;
          if (o.y > h + o.r) o.y = -o.r;
          const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
          grad.addColorStop(0, `hsla(${o.hue}, 85%, 60%, ${o.a})`);
          grad.addColorStop(1, `hsla(${o.hue}, 85%, 60%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener('resize', resize);
      resize(); tick();
    })();

    // Google Maps
    let map, directionsService, directionsRenderer;

    function initMap() {
      console.log('Initializing map...');
      
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 53.3498, lng: -6.2603 },
        zoom: 13
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map });

      new google.maps.places.Autocomplete(document.getElementById('start'));
      new google.maps.places.Autocomplete(document.getElementById('dest'));

      document.getElementById('routeBtn').addEventListener('click', buildRoute);
      document.getElementById('fabTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      
      console.log('Map initialized successfully');
    }

    function streetViewUrl(lat, lng, heading) {
      return `https://maps.googleapis.com/maps/api/streetview?size=600x300&location=${lat},${lng}&heading=${heading}&fov=90&pitch=0&key=${apiKey}`;
    }

    function buildRoute() {
      console.log('=== BUILD ROUTE STARTED ===');
      
      const start = document.getElementById('start').value.trim();
      const dest = document.getElementById('dest').value.trim();
      
      console.log('Start:', start);
      console.log('Dest:', dest);
      
      if (!start || !dest) {
        showToast('Enter start and destination', 'error');
        return;
      }

      const stepsEl = document.getElementById('steps');
      const loadingEl = document.getElementById('loadingSteps');
      const summaryEl = document.getElementById('routeSummary');

      stepsEl.innerHTML = '';
      loadingEl.style.display = 'flex';
      summaryEl.innerHTML = '';

      const req = {
        origin: start,
        destination: dest,
        travelMode: 'TRANSIT',
        transitOptions: { departureTime: new Date() }
      };

      console.log('Sending directions request...');

      try {
        directionsService.route(req, function(result, status) {
          try {
        console.log('=== DIRECTIONS RESPONSE ===');
        console.log('Status:', status);
        
        loadingEl.style.display = 'none';

        if (status !== "OK") {
          console.error('Route failed:', status);
          stepsEl.innerHTML = `<div class="error-state"><div class="error-icon">⚠️</div><p class="error-title">Route not found</p><p class="error-subtitle">Status: ${status}</p></div>`;
          showToast('Route not found', 'error');
          return;
        }

        directionsRenderer.setDirections(result);
        const leg = result.routes[0].legs[0];
        
        console.log('Route has', leg.steps.length, 'steps');

        summaryEl.innerHTML = `
          <div class="summary-card">
            <div class="summary-main">
              <span class="summary-duration">${leg.duration.text}</span>
              <span class="summary-distance">${leg.distance.text}</span>
            </div>
            <div class="summary-details">
              <span>🚦 ${leg.steps.length} steps</span>
            </div>
          </div>`;

        console.log('Starting to build steps HTML...');
        let html = "";

        // Build all HTML completely synchronously
        for (let i = 0; i < leg.steps.length; i++) {
          try {
            console.log('Processing step', i + 1, 'of', leg.steps.length);
            
            const step = leg.steps[i];
            let lat = step.start_location.lat();
            let lng = step.start_location.lng();
            let isTransit = false;
            let stepIcon = '🚶';
            let title = (step.instructions || '').replace(/<[^>]*>/g, '');
            let subtitle = `${step.distance?.text || ''} • ${step.duration?.text || ''}`;

            if (step.transit) {
              isTransit = true;
              stepIcon = '🚌';
              const t = step.transit;
              const dep = t.departure_stop;
              if (dep && dep.location) {
                lat = dep.location.lat();
                lng = dep.location.lng();
              }
              const line = (t.line && t.line.short_name) || (t.line && t.line.name) || 'Transit';
              title = `Take ${line}`;
              subtitle = `${(dep && dep.name) || 'Board'} → ${(t.arrival_stop && t.arrival_stop.name) || 'Exit'}`;
            }

            let heading = 0;
            try {
              if (window.google && window.google.maps && window.google.maps.geometry) {
                heading = google.maps.geometry.spherical.computeHeading(step.start_location, step.end_location);
              }
            } catch(e) {
              console.warn('Heading calc failed for step', i + 1, ':', e);
            }

            const img = streetViewUrl(lat, lng, heading);

            html += `
              <div class="step ${isTransit ? 'transit' : 'walk'}">
                <div class="node">${stepIcon}</div>
                <div class="step-content">
                  <div class="step-header">
                    <span class="step-number">Step ${i + 1} of ${leg.steps.length}</span>
                    <span class="step-badge ${isTransit ? 'badge-transit' : 'badge-walk'}">
                      ${isTransit ? 'TRANSIT' : 'WALK'}
                    </span>
                  </div>
                  
                  <div class="step-body">
                    <div class="step-image-wrapper">
                      <img src="${img}" alt="Step ${i + 1}" loading="lazy" style="width:100%; height:200px; object-fit:cover; border-radius:12px; border:1px solid var(--border);" />
                    </div>
                    <div class="step-info">
                      <div class="step-title">${title}</div>
                      <div class="step-subtitle">${subtitle}</div>
                    </div>
                  </div>
                </div>
              </div>`;
              
            console.log('Step', i + 1, 'HTML built successfully');
          } catch (stepError) {
            console.error('Error building HTML for step', i + 1, ':', stepError);
            // Continue to next step
          }
        }

        console.log('=== INSERTING HTML INTO DOM ===');
        console.log('Total HTML length:', html.length);
        
        if (html.length === 0) {
          console.error('HTML is empty!');
          stepsEl.innerHTML = `<div class="error-state"><div class="error-icon">⚠️</div><p class="error-title">Could not generate steps</p></div>`;
          return;
        }
        
        stepsEl.innerHTML = html;
        
        console.log('HTML inserted successfully');
        console.log('Steps element now has', stepsEl.children.length, 'children');
        
        showToast('Route loaded with ' + leg.steps.length + ' steps!', 'success');
        
        setTimeout(function() {
          const timeline = document.querySelector('.timeline');
          if (timeline) {
            timeline.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }, 500);
          } catch (innerError) {
            console.error('Error in route callback:', innerError);
            loadingEl.style.display = 'none';
            stepsEl.innerHTML = `<div class="error-state"><div class="error-icon">⚠️</div><p class="error-title">Error processing route</p><p class="error-subtitle">${innerError.message}</p></div>`;
          }
        });
      } catch (outerError) {
        console.error('Error calling directions service:', outerError);
        loadingEl.style.display = 'none';
        stepsEl.innerHTML = `<div class="error-state"><div class="error-icon">⚠️</div><p class="error-title">Error requesting route</p></div>`;
      }
    }

    window.initMap = initMap;
  </script>

  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVs3hWImBAcyyucwIzQtVwRpq-jzesCzA&libraries=places,geometry&callback=initMap"></script>
</body>
</html>
